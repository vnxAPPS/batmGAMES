<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roblox Runner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #12141d;
    --bg2: #1c2030;
    --text: #f2f4ff;
    --muted: #8b92b0;
    --accent: #00a2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg2), var(--bg1));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #wrap { position: relative; width: 100%; max-width: 640px; }
  canvas { display: block; width: 100%; touch-action: manipulation; }
  #hud {
    position: absolute;
    top: 10px; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    font-weight: 800;
    font-size: 16px;
    pointer-events: none;
  }
  #hud .best { color: var(--muted); }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(10, 12, 20, 0.72);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 26px; font-weight: 800; }
  #overlay p { color: var(--muted); font-size: 14px; max-width: 300px; line-height: 1.5; }
  #overlay .score-line { font-size: 18px; font-weight: 700; color: var(--accent); }
  /* ── Liquid Glass Button ── */
  .btn-base{position:relative;display:inline-block;padding:3px;border-radius:21px;margin-top:8px;}
  .btn-base--blue{background:linear-gradient(135deg,#00a2ff,#0062ff);}
  button {
    position:relative;margin-top:0;padding:14px 44px;
    background:radial-gradient(circle at var(--light-x,50%) var(--light-y,50%),rgba(255,255,255,0.35),transparent 50%),rgba(255,255,255,0.12);
    backdrop-filter:blur(8px) saturate(1.2);
    color:#fff; border:none; border-radius:18px;
    font-size:16px; font-weight:800; cursor:pointer;
    box-shadow:inset 0 1px 3px rgba(255,255,255,0.6),inset 0 -10px 20px rgba(0,0,0,0.15),0 4px 24px rgba(0,0,0,0.3);
    transform:scale(var(--btn-scale,1));transition:box-shadow .3s;
  }
  button::before{content:'';position:absolute;inset:0;border-radius:inherit;
    border:1.5px solid rgba(255,255,255,0.4);
    mask:linear-gradient(135deg,#000 30%,transparent 70%);pointer-events:none;}
  button::after{content:'';position:absolute;top:8%;left:15%;width:40%;height:25%;
    background:radial-gradient(ellipse,rgba(255,255,255,0.5),transparent 70%);
    transform:translate(var(--light-offset-x,0),var(--light-offset-y,0));
    transition:transform .6s cubic-bezier(.25,.46,.45,.94);pointer-events:none;border-radius:50%;}
  @media(prefers-reduced-motion:reduce){
    button{transition:transform .2s;}
    button:hover{transform:scale(1.02);}
    button:active{transform:scale(0.98);}
  }
  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    text-decoration: none;
    border-radius: 10px;
    background: rgba(255,112,0,0.12);
    border: 1px solid rgba(255,112,0,0.35);
    box-shadow: 0 0 10px rgba(255,112,0,0.25), inset 0 0 8px rgba(255,112,0,0.08);
    transition: all 0.15s;
    flex-shrink: 0;
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
  }
  .back-btn:active {
    transform: translateX(-50%) scale(0.92);
    box-shadow: 0 0 18px rgba(255,112,0,0.5), inset 0 0 12px rgba(255,112,0,0.15);
  }
  .back-arrow {
    display: block;
    width: 14px;
    height: 14px;
    border-left: 2.5px solid #ff7000;
    border-bottom: 2.5px solid #ff7000;
    transform: rotate(45deg) translateX(2px);
    filter: drop-shadow(0 0 4px #ff7000);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="hud">
    <span id="score">0</span>
    <a class="back-btn" href="../"><span class="back-arrow"></span></a>
    <span class="best" id="best">🏆 0</span>
  </div>
  <div id="overlay">
    <h1>🏃 Roblox Runner</h1>
    <p>Тапни или нажми пробел, чтобы прыгать. Перепрыгивай кубики — скорость растёт!</p>
    <div class="btn-base btn-base--blue">
      <button id="startBtn">Играть</button>
    </div>
  </div>
</div>

<script>
"use strict";
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 64;

// ── Кастомный персонаж из редактора ─────────────────────────────────────────
let _charRaw = null;
try { _charRaw = JSON.parse(localStorage.getItem("batm_character") || "null"); } catch(e) {}
const CHAR = {
  legs:  _charRaw?.legs_color  ?? "#2d4fd6",
  torso: _charRaw?.torso_color ?? "#22c55e",
  arms:  _charRaw?.arms_color  ?? "#ffd23e",
  head:  _charRaw?.head_color  ?? "#ffd23e",
  hair:  _charRaw?.hair_style  ?? "none",
  face:  _charRaw?.face_emotion ?? "smile",
};
function _darken(hex, amt = 55) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
}

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");

let best = Number(localStorage.getItem("runner_best") || 0);
bestEl.textContent = "🏆 " + best;

// ── Состояние игры ──────────────────────────────────────────
const state = {
  running: false,
  t: 0,
  speed: 6,
  score: 0,
  obstacles: [],
  clouds: [],
  particles: [],
  nextSpawn: 0,
};

const player = {
  x: 90, y: GROUND_Y, w: 42, h: 54,
  vy: 0, jumping: false,
  legPhase: 0,
};

function reset() {
  state.t = 0;
  state.speed = 6;
  state.score = 0;
  state.obstacles = [];
  state.particles = [];
  state.nextSpawn = 40;
  player.y = GROUND_Y;
  player.vy = 0;
  player.jumping = false;
  if (state.clouds.length === 0) {
    for (let i = 0; i < 4; i++) {
      state.clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 90, s: 0.3 + Math.random() * 0.5 });
    }
  }
}

// ── Управление ──────────────────────────────────────────────
function jump() {
  if (!state.running) return;
  if (!player.jumping) {
    player.vy = -13.5;
    player.jumping = true;
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  }
}
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); }
});
// прыжок тапом в любом месте экрана — и по игре, и под ней (#2)
document.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, a")) return;
  jump();
});
startBtn.addEventListener("click", start);

let lastTime = 0;

function start() {
  reset();
  overlay.classList.add("hidden");
  state.running = true;
  lastTime = 0;
  requestAnimationFrame(loop);
}

// ── Спавн кубиков ───────────────────────────────────────────
const CUBE_COLORS = ["#e2241d", "#ffb020", "#22e77c", "#a23cf5", "#00a2ff"];
function spawnObstacle() {
  const double = Math.random() < Math.min(0.35, state.score / 4000);
  const size = 34 + Math.random() * 10;
  const color = CUBE_COLORS[(Math.random() * CUBE_COLORS.length) | 0];
  state.obstacles.push({ x: W + 20, size, color, stacked: double });
  state.nextSpawn = 55 + Math.random() * 60 - Math.min(30, state.speed * 2);
}

// ── Отрисовка ───────────────────────────────────────────────
function drawBackground(dt = 0) {
  // небо-градиент рисует CSS, тут — параллакс-облака и сетка-пол
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  for (const c of state.clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 34, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    c.x -= c.s * state.speed * 0.25 * dt;
    if (c.x < -50) { c.x = W + 50; c.y = 30 + Math.random() * 90; }
  }
  // пол
  ctx.fillStyle = "#232840";
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.strokeStyle = "rgba(255,255,255,0.10)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
  // бегущие насечки на полу
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  const off = (state.t * state.speed) % 40;
  for (let x = -off; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y + 12);
    ctx.lineTo(x + 18, GROUND_Y + 12);
    ctx.stroke();
  }
}

function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
}

function drawPlayer(dt = 0) {
  const { x, w, h } = player;
  const y = player.y - h;
  player.legPhase += state.speed * 0.09 * dt;
  const legSwing = player.jumping ? 0 : Math.sin(player.legPhase) * 7;

  // тень
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  const airFactor = Math.max(0.35, 1 - (GROUND_Y - player.y) / 140);
  ctx.ellipse(x + w / 2, GROUND_Y + 8, 24 * airFactor, 6 * airFactor, 0, 0, Math.PI * 2);
  ctx.fill();

  // ноги
  roundRect(x + 4,      y + h - 18 + legSwing * 0.4, 14, 18 - legSwing * 0.4, 4, CHAR.legs);
  roundRect(x + w - 18, y + h - 18 - legSwing * 0.4, 14, 18 + legSwing * 0.4, 4, CHAR.legs);
  // торс
  roundRect(x, y + 16, w, 24, 6, CHAR.torso);
  // руки
  const armSwing = player.jumping ? -6 : Math.sin(player.legPhase) * 5;
  roundRect(x - 10, y + 18 + armSwing, 10, 20, 4, CHAR.arms);
  roundRect(x + w,  y + 18 - armSwing, 10, 20, 4, CHAR.arms);
  // голова
  roundRect(x + 5, y - 6, w - 10, 26, 8, CHAR.head);

  // причёска
  const hairColor = _darken(CHAR.head, 55);
  if (CHAR.hair === "default") {
    roundRect(x + 5, y - 12, w - 10, 10, [5,5,0,0], hairColor);
  } else if (CHAR.hair === "spiky") {
    ctx.fillStyle = hairColor;
    for (let i = 0; i < 4; i++) {
      const sx = x + 8 + i * ((w - 10) / 3.5);
      ctx.beginPath();
      ctx.moveTo(sx, y - 2);
      ctx.lineTo(sx - 5, y - 14);
      ctx.lineTo(sx + 5, y - 14);
      ctx.closePath(); ctx.fill();
    }
  } else if (CHAR.hair === "long") {
    roundRect(x + 5, y - 12, w - 10, 10, [5,5,0,0], hairColor);
    roundRect(x - 2, y - 2, 9, 20, 3, hairColor);
    roundRect(x + w - 7, y - 2, 9, 20, 3, hairColor);
  }

  // лицо
  const faceColor = "#1a1a1a";
  const eyeLX = x + 13, eyeRX = x + w - 13, eyeY = y + 5;
  if (CHAR.face === "cool") {
    // очки
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    roundRect(eyeLX - 7, eyeY - 4, 13, 9, 3, "rgba(0,0,0,0.75)");
    roundRect(eyeRX - 6, eyeY - 4, 13, 9, 3, "rgba(0,0,0,0.75)");
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    roundRect(eyeLX - 7, eyeY - 4, 13, 3, [3,3,0,0], "rgba(255,255,255,0.15)");
    roundRect(eyeRX - 6, eyeY - 4, 13, 3, [3,3,0,0], "rgba(255,255,255,0.15)");
  } else {
    // обычные глаза
    ctx.fillStyle = faceColor;
    ctx.beginPath();
    ctx.arc(eyeLX, eyeY, 2.6, 0, Math.PI * 2);
    ctx.arc(eyeRX, eyeY, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // рот
  ctx.strokeStyle = faceColor; ctx.lineWidth = 2;
  if (CHAR.face === "happy" || CHAR.face === "smile") {
    ctx.beginPath();
    ctx.arc(x + w / 2, y + 9, CHAR.face === "happy" ? 9 : 7,
            0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  } else if (CHAR.face === "serious") {
    ctx.beginPath();
    ctx.moveTo(x + 12, y + 14); ctx.lineTo(x + w - 12, y + 14);
    ctx.stroke();
  } else if (CHAR.face === "cool") {
    ctx.beginPath();
    ctx.arc(x + w / 2 + 3, y + 14, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }
}

function drawObstacles() {
  for (const o of state.obstacles) {
    const count = o.stacked ? 2 : 1;
    for (let i = 0; i < count; i++) {
      const y = GROUND_Y - o.size * (i + 1);
      // кубик с гранью-подсветкой
      roundRect(o.x, y, o.size, o.size, 6, o.color);
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.beginPath();
      ctx.roundRect(o.x, y, o.size, 8, { tl: 6, tr: 6, bl: 0, br: 0 });
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x + 0.5, y + 0.5, o.size - 1, o.size - 1);
    }
  }
}

function drawParticles() {
  for (const p of state.particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

// ── Логика ──────────────────────────────────────────────────
// dt — время кадра, нормированное к 60 FPS: на 120 Гц экране dt ≈ 0.5,
// поэтому игра идёт с одинаковой скоростью на любом устройстве (#1)
function update(dt) {
  state.t += dt;
  state.speed = 6 + Math.min(8, state.score / 600);
  state.score += state.speed * 0.12 * dt;

  // прыжок/гравитация
  player.vy += 0.72 * dt;
  player.y += player.vy * dt;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.jumping = false;
  }

  // пыль из-под ног
  if (!player.jumping && Math.floor(state.t) % 5 === 0) {
    state.particles.push({
      x: player.x + 6, y: GROUND_Y - 2,
      vx: -state.speed * 0.4, vy: -Math.random(),
      s: 3, life: 18, max: 18, color: "#8b92b0",
    });
  }
  for (const p of state.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  state.particles = state.particles.filter((p) => p.life > 0);

  // препятствия
  state.nextSpawn -= dt;
  if (state.nextSpawn <= 0) spawnObstacle();
  for (const o of state.obstacles) o.x -= state.speed * dt;
  state.obstacles = state.obstacles.filter((o) => o.x + o.size > -30);

  // столкновения (щадящий хитбокс)
  const px = player.x + 6, pw = player.w - 12;
  const py = player.y - player.h + 6, ph = player.h - 8;
  for (const o of state.obstacles) {
    const oh = o.stacked ? o.size * 2 : o.size;
    const oy = GROUND_Y - oh;
    if (px < o.x + o.size - 6 && px + pw > o.x + 6 && py + ph > oy + 4) {
      return gameOver();
    }
  }

  scoreEl.textContent = Math.floor(state.score);
}

function gameOver() {
  state.running = false;
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
  const final = Math.floor(state.score);
  if (final > best) {
    best = final;
    localStorage.setItem("runner_best", best);
    bestEl.textContent = "🏆 " + best;
  }
  overlay.innerHTML = `
    <h1>💥 Ой!</h1>
    <div class="score-line">Счёт: ${final} · Рекорд: ${best}</div>
    <p>${final >= best && final > 0 ? "Новый рекорд! 🎉" : "Кубики коварны. Попробуешь ещё?"}</p>
    <div class="btn-base btn-base--blue">
      <button id="againBtn">Ещё раз</button>
    </div>`;
  overlay.classList.remove("hidden");
  const btn = document.getElementById("againBtn");
  btn.addEventListener("click", start);
  initLiquidGlass(btn);
}

// ── Liquid Glass Physics ────────────────────────────────────────────────────
class SpringValue {
  constructor(initial, stiffness = 0.08, damping = 0.82) {
    this.current = initial;
    this.target = initial;
    this.velocity = 0;
    this.stiffness = stiffness;
    this.damping = damping;
  }
  update() {
    this.velocity += (this.target - this.current) * this.stiffness;
    this.velocity *= this.damping;
    this.current += this.velocity;
  }
  set(newTarget) { this.target = newTarget; }
}

function initLiquidGlass(btn) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const springs = {
    lightX: new SpringValue(0.5, 0.08, 0.82),
    lightY: new SpringValue(0.5, 0.08, 0.82),
    scale: new SpringValue(1.0, 0.15, 0.75),
    offsetX: new SpringValue(0, 0.08, 0.82),
    offsetY: new SpringValue(0, 0.08, 0.82),
  };
  let animFrame = null;
  const loop = () => {
    springs.lightX.update();
    springs.lightY.update();
    springs.scale.update();
    springs.offsetX.update();
    springs.offsetY.update();
    btn.style.setProperty('--light-x', `${springs.lightX.current * 100}%`);
    btn.style.setProperty('--light-y', `${springs.lightY.current * 100}%`);
    btn.style.setProperty('--btn-scale', springs.scale.current);
    btn.style.setProperty('--light-offset-x', `${springs.offsetX.current}px`);
    btn.style.setProperty('--light-offset-y', `${springs.offsetY.current}px`);
    animFrame = requestAnimationFrame(loop);
  };
  btn.addEventListener('pointerenter', () => { cancelAnimationFrame(animFrame); loop(); });
  btn.addEventListener('pointermove', (e) => {
    const rect = btn.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    springs.lightX.set(x);
    springs.lightY.set(y);
    springs.offsetX.set((x - 0.5) * 12);
    springs.offsetY.set((y - 0.5) * 12);
  });
  btn.addEventListener('pointerdown', () => { springs.scale.set(0.965); });
  btn.addEventListener('pointerup', () => {
    springs.scale.set(1.01);
    setTimeout(() => springs.scale.set(1.0), 50);
  });
  btn.addEventListener('pointerleave', () => {
    cancelAnimationFrame(animFrame);
    springs.lightX.set(0.5);
    springs.lightY.set(0.5);
    springs.scale.set(1.0);
    springs.offsetX.set(0);
    springs.offsetY.set(0);
  });
}

document.getElementById("startBtn").addEventListener("click", start);
initLiquidGlass(document.getElementById("startBtn"));

function loop(now) {
  if (!state.running) return;
  // dt в «кадрах 60 FPS»: 16.67 мс → 1.0; ограничиваем на случай сворачивания
  const dt = lastTime ? Math.min((now - lastTime) / 16.667, 3) : 1;
  lastTime = now;
  update(dt);
  ctx.clearRect(0, 0, W, H);
  drawBackground(dt);
  drawParticles();
  drawObstacles();
  drawPlayer(dt);
  requestAnimationFrame(loop);
}

// первый кадр-превью за оверлеем
reset();
drawBackground();
drawPlayer();
</script>
</body>
</html>
