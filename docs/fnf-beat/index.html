<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FNF Beat Battle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../fnf-core/style.css">
<style>
.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  text-decoration: none;
  border-radius: 10px;
  background: rgba(255,112,0,0.12);
  border: 1px solid rgba(255,112,0,0.35);
  box-shadow: 0 0 10px rgba(255,112,0,0.25), inset 0 0 8px rgba(255,112,0,0.08);
  transition: all 0.15s;
  flex-shrink: 0;
}
.back-btn:active {
  transform: scale(0.92);
  box-shadow: 0 0 18px rgba(255,112,0,0.5), inset 0 0 12px rgba(255,112,0,0.15);
}
.back-arrow {
  display: block;
  width: 14px;
  height: 14px;
  border-left: 2.5px solid #ff7000;
  border-bottom: 2.5px solid #ff7000;
  transform: rotate(45deg) translateX(2px);
  filter: drop-shadow(0 0 4px #ff7000);
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <a class="back-btn" href="../"><span class="back-arrow"></span></a>
  <button id="botplay">🤖 BOT PLAY</button>
  <div id="overlay">
    <h1>🎹 FNF Beat Battle</h1>
    <p>Классика: лови стрелки в такт! Тапай по нужной полосе или жми стрелки / DFJK на клавиатуре.</p>
    <button id="playBtn">▶ Играть</button>
  </div>
</div>

<script>
  window.FNF_CONFIG = {
    song: "beat",
    title: "🎹 FNF Beat Battle",
    hint: "Классика: лови стрелки в такт! Тапай по полосе или жми стрелки / DFJK.",
  };
</script>
<script src="../fnf-core/engine.js"></script>
</body>
</html>
