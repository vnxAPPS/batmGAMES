<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎹 FNF Beat Battle — batmGAMES</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg1:#05070c; --bg2:#0a0d12; --card:#161d2b;
  --text:#f2f4ff; --muted:#8b92b0; --border:rgba(255,255,255,0.07);
  --purple:#a23cf5;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;background:var(--bg1);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;}

#wrap{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;padding:8px 14px;gap:10px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;}
.back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;
  text-decoration:none;border-radius:10px;background:rgba(255,112,0,0.12);
  border:1px solid rgba(255,112,0,0.35);box-shadow:0 0 10px rgba(255,112,0,0.25);
  transition:all 0.15s;flex-shrink:0;}
.back-btn:active{transform:scale(0.92);}
.back-arrow{display:block;width:14px;height:14px;
  border-left:2.5px solid #ff7000;border-bottom:2.5px solid #ff7000;
  transform:rotate(45deg) translateX(2px);filter:drop-shadow(0 0 4px #ff7000);}
#topbar-title{flex:1;text-align:center;font-size:15px;font-weight:800;}

#game-area{flex:1;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#0a0d12,#05070c);position:relative;}
#game{display:block;width:100%;height:100%;touch-action:none;}

/* ── Overlay ── */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:rgba(5,7,12,0.88);backdrop-filter:blur(8px);
  text-align:center;padding:24px;z-index:30;}
.overlay.hidden{display:none;}
.ov-emoji{font-size:52px;line-height:1;}
.ov-title{font-size:24px;font-weight:900;}
.ov-sub{font-size:13px;color:var(--muted);text-align:center;
  padding:0 24px;line-height:1.5;max-width:340px;}

/* ── Liquid Glass Button ── */
.btn-base{position:relative;display:inline-block;padding:3px;border-radius:21px;margin-top:8px;}
.btn-base--purple{background:linear-gradient(135deg,#a23cf5,#6414c9);}
button{position:relative;margin-top:0;padding:14px 44px;
  background:radial-gradient(circle at var(--light-x,50%) var(--light-y,50%),rgba(255,255,255,0.35),transparent 50%),rgba(255,255,255,0.12);
  backdrop-filter:blur(8px) saturate(1.2);
  color:#fff;border:none;border-radius:18px;
  font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:inset 0 1px 3px rgba(255,255,255,0.6),inset 0 -10px 20px rgba(0,0,0,0.15),0 4px 24px rgba(0,0,0,0.3);
  transform:scale(var(--btn-scale,1));transition:box-shadow .3s;}
button::before{content:'';position:absolute;inset:0;border-radius:inherit;
  border:1.5px solid rgba(255,255,255,0.4);
  mask:linear-gradient(135deg,#000 30%,transparent 70%);pointer-events:none;}
button::after{content:'';position:absolute;top:8%;left:15%;width:40%;height:25%;
  background:radial-gradient(ellipse,rgba(255,255,255,0.5),transparent 70%);
  transform:translate(var(--light-offset-x,0),var(--light-offset-y,0));
  transition:transform .6s cubic-bezier(.25,.46,.45,.94);pointer-events:none;border-radius:50%;}
@media(prefers-reduced-motion:reduce){
  button{transition:transform .2s;}
  button:hover{transform:scale(1.02);}
  button:active{transform:scale(0.98);}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <a class="back-btn" href="../"><span class="back-arrow"></span></a>
    <div id="topbar-title">🎹 FNF Beat Battle</div>
  </div>

  <div id="game-area">
    <canvas id="game"></canvas>

    <div class="overlay" id="overlay">
      <div class="ov-emoji">🎹</div>
      <div class="ov-title">FNF Beat Battle</div>
      <div class="ov-sub">Классика: лови стрелки в такт! Тапай по нужной полосе или жми стрелки / DFJK на клавиатуре.</div>
      <div class="btn-base btn-base--purple">
        <button id="playBtn">Играть</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Liquid Glass Physics ────────────────────────────────────────────────────
class SpringValue {
  constructor(initial, stiffness = 0.08, damping = 0.82) {
    this.current = initial;
    this.target = initial;
    this.velocity = 0;
    this.stiffness = stiffness;
    this.damping = damping;
  }
  update() {
    this.velocity += (this.target - this.current) * this.stiffness;
    this.velocity *= this.damping;
    this.current += this.velocity;
  }
  set(newTarget) { this.target = newTarget; }
}

function initLiquidGlass(btn) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const springs = {
    lightX: new SpringValue(0.5, 0.08, 0.82),
    lightY: new SpringValue(0.5, 0.08, 0.82),
    scale: new SpringValue(1.0, 0.15, 0.75),
    offsetX: new SpringValue(0, 0.08, 0.82),
    offsetY: new SpringValue(0, 0.08, 0.82),
  };
  let animFrame = null;
  const loop = () => {
    springs.lightX.update();
    springs.lightY.update();
    springs.scale.update();
    springs.offsetX.update();
    springs.offsetY.update();
    btn.style.setProperty('--light-x', `${springs.lightX.current * 100}%`);
    btn.style.setProperty('--light-y', `${springs.lightY.current * 100}%`);
    btn.style.setProperty('--btn-scale', springs.scale.current);
    btn.style.setProperty('--light-offset-x', `${springs.offsetX.current}px`);
    btn.style.setProperty('--light-offset-y', `${springs.offsetY.current}px`);
    animFrame = requestAnimationFrame(loop);
  };
  btn.addEventListener('pointerenter', () => { cancelAnimationFrame(animFrame); loop(); });
  btn.addEventListener('pointermove', (e) => {
    const rect = btn.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    springs.lightX.set(x);
    springs.lightY.set(y);
    springs.offsetX.set((x - 0.5) * 12);
    springs.offsetY.set((y - 0.5) * 12);
  });
  btn.addEventListener('pointerdown', () => { springs.scale.set(0.965); });
  btn.addEventListener('pointerup', () => {
    springs.scale.set(1.01);
    setTimeout(() => springs.scale.set(1.0), 50);
  });
  btn.addEventListener('pointerleave', () => {
    cancelAnimationFrame(animFrame);
    springs.lightX.set(0.5);
    springs.lightY.set(0.5);
    springs.scale.set(1.0);
    springs.offsetX.set(0);
    springs.offsetY.set(0);
  });
}

// ── Game stub ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const area = document.getElementById('game-area');
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
}
resize();
window.addEventListener('resize', resize);

document.getElementById('playBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  ctx.fillStyle = '#0a0d12';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#a23cf5';
  ctx.font = '24px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🎹 FNF Beat Battle — coming soon', canvas.width/2, canvas.height/2);
});

initLiquidGlass(document.getElementById('playBtn'));
</script>
</body>
</html>
