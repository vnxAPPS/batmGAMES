<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>👤 Мой персонаж — batmGAMES</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg1: #05070c;
  --bg2: #0a0d12;
  --card: #161d2b;
  --accent: #a23cf5;
  --text: #f2f4ff;
  --muted: #8b92b0;
  --border: rgba(255,255,255,0.07);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%; width: 100%;
  background: var(--bg1);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── Topbar ── */
#topbar {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  gap: 10px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  text-decoration: none;
  border-radius: 10px;
  background: rgba(255,112,0,0.12);
  border: 1px solid rgba(255,112,0,0.35);
  box-shadow: 0 0 10px rgba(255,112,0,0.25), inset 0 0 8px rgba(255,112,0,0.08);
  transition: all 0.15s;
  flex-shrink: 0;
}
.back-btn:active {
  transform: scale(0.92);
  box-shadow: 0 0 18px rgba(255,112,0,0.5), inset 0 0 12px rgba(255,112,0,0.15);
}
.back-arrow {
  display: block;
  width: 14px;
  height: 14px;
  border-left: 2.5px solid #ff7000;
  border-bottom: 2.5px solid #ff7000;
  transform: rotate(45deg) translateX(2px);
  filter: drop-shadow(0 0 4px #ff7000);
}
#topbar-title {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 800;
}
#save-btn {
  padding: 8px 18px;
  background: linear-gradient(135deg, var(--accent), #6414c9);
  color: #fff;
  border: none;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(162,60,245,0.4);
  transition: transform 0.12s, opacity 0.12s;
  white-space: nowrap;
}
#save-btn:active { transform: scale(0.95); opacity: 0.9; }
#save-btn.saved {
  background: linear-gradient(135deg, #22e77c, #0d9b52);
  box-shadow: 0 4px 16px rgba(34,231,124,0.4);
}

/* ── Canvas area ── */
#canvas-area {
  flex: 1 1 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
#char-canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
}

/* ── Controls ── */
#controls {
  flex-shrink: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 14px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  touch-action: none;
}

/* Attribute name row */
.attr-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  height: 36px;
  overflow: hidden;
  position: relative;
}
.nav-arrow {
  font-size: 22px;
  color: var(--muted);
  cursor: pointer;
  padding: 0 6px;
  line-height: 1;
  transition: color 0.15s;
}
.nav-arrow:active { color: var(--text); }
#attr-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  position: relative;
  transition: opacity 0.15s;
}

/* Value row */
.val-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.val-arrow {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s, background 0.12s;
}
.val-arrow:active { transform: scale(0.9); background: #222c3d; }

#val-display {
  flex: 1;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 15px;
  font-weight: 700;
  overflow: hidden;
  position: relative;
}

/* Color swatch inside val-display */
.val-swatch {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.3);
  box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
  flex-shrink: 0;
}
.val-label {
  font-size: 14px;
  font-weight: 700;
}

/* Name input */
#name-wrap {
  display: none;
}
#name-wrap.active { display: block; }
#name-input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 15px;
  outline: none;
}
#name-input::placeholder { color: var(--muted); }
#name-input:focus { border-color: var(--accent); }

/* Dots indicator */
.dots {
  display: flex;
  justify-content: center;
  gap: 5px;
}
.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.dot.active {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(1.3);
}

/* Slide animations */
@keyframes slideInRight { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
@keyframes slideInLeft  { from { opacity:0; transform:translateX(-30px);} to { opacity:1; transform:translateX(0); } }
@keyframes slideInUp    { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideInDown  { from { opacity:0; transform:translateY(-12px);} to { opacity:1; transform:translateY(0); } }
.anim-right { animation: slideInRight 0.2s ease both; }
.anim-left  { animation: slideInLeft  0.2s ease both; }
.anim-up    { animation: slideInUp    0.18s ease both; }
.anim-down  { animation: slideInDown  0.18s ease both; }

/* Character float */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
.floating { animation: float 2.8s ease-in-out infinite; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a class="back-btn" href="../"><span class="back-arrow"></span></a>
    <div id="topbar-title">👤 Мой персонаж</div>
    <button id="save-btn">💾 Сохранить</button>
  </div>

  <div id="canvas-area">
    <canvas id="char-canvas"></canvas>
  </div>

  <div id="controls">
    <!-- attribute navigation (up/down) -->
    <div class="attr-nav">
      <span class="nav-arrow" id="attr-up">↑</span>
      <span id="attr-name">НОГИ</span>
      <span class="nav-arrow" id="attr-down">↓</span>
    </div>

    <!-- value navigation (left/right) -->
    <div class="val-nav" id="val-nav">
      <button class="val-arrow" id="val-prev">‹</button>
      <div id="val-display"></div>
      <button class="val-arrow" id="val-next">›</button>
    </div>

    <!-- name input (only for NAME attribute) -->
    <div id="name-wrap">
      <input type="text" id="name-input" placeholder="Введи имя персонажа..." maxlength="16">
    </div>

    <!-- dots indicator -->
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Palette & Options ────────────────────────────────────────────
const COLORS = [
  '#2d4fd6','#22c55e','#ffd23e','#ff4b4b','#a23cf5','#00c2ff',
  '#f97316','#ec4899','#8b5cf6','#10b981','#ff6b6b','#64748b'
];
const HAIR_OPTIONS = [
  { id:'none',    label:'Без причёски' },
  { id:'default', label:'Классика' },
  { id:'spiky',   label:'Ёжик' },
  { id:'long',    label:'Длинные' },
];
const FACE_OPTIONS = [
  { id:'smile',   label:'😊 Улыбка' },
  { id:'cool',    label:'😎 Крутой' },
  { id:'happy',   label:'😄 Весёлый' },
  { id:'serious', label:'😐 Серьёзный' },
];

// ── Attributes definition ────────────────────────────────────────
const ATTRS = [
  { key:'legs_color',   label:'НОГИ',     type:'color',   values: COLORS },
  { key:'torso_color',  label:'ТОРС',     type:'color',   values: COLORS },
  { key:'arms_color',   label:'РУКИ',     type:'color',   values: COLORS },
  { key:'head_color',   label:'ГОЛОВА',   type:'color',   values: COLORS },
  { key:'hair_style',   label:'ПРИЧЕСКА', type:'option',  values: HAIR_OPTIONS },
  { key:'face_emotion', label:'ЭМОЦИЯ',   type:'option',  values: FACE_OPTIONS },
  { key:'name',         label:'ИМЯ',      type:'text' },
];

// ── State ────────────────────────────────────────────────────────
let character = {
  legs_color:   '#2d4fd6',
  torso_color:  '#22c55e',
  arms_color:   '#ffd23e',
  head_color:   '#ffd23e',
  hair_style:   'default',
  face_emotion: 'smile',
  name:         '',
};

const saved = localStorage.getItem('batm_character');
if (saved) { try { character = { ...character, ...JSON.parse(saved) }; } catch(e){} }

let attrIdx = 0; // current attribute index

// ── Canvas setup ─────────────────────────────────────────────────
const canvas = document.getElementById('char-canvas');
const ctx    = canvas.getContext('2d');
const area   = document.getElementById('canvas-area');

function resizeCanvas() {
  const size = Math.min(area.clientWidth, area.clientHeight, 320);
  canvas.width  = size;
  canvas.height = size * 1.35;
}
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(area);

// ── Draw character ───────────────────────────────────────────────
function drawCharacter(glowPart) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const cx   = W / 2;
  const base = H * 0.72;

  // proportions relative to canvas width
  const bw   = W * 0.36;  // body width
  const th   = H * 0.26;  // torso height
  const lh   = H * 0.22;  // leg height
  const lw   = bw * 0.38; // leg width
  const aw   = bw * 0.22; // arm width
  const ah   = th * 0.82; // arm height
  const hw   = bw * 0.72; // head width
  const hh   = H * 0.22;  // head height

  const torsoY = base - th;
  const legY   = base;
  const armY   = torsoY + th * 0.12;
  const headY  = torsoY - hh + H * 0.04;

  function glow(part) {
    if (glowPart !== part) return;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur  = 18;
  }
  function noGlow() { ctx.shadowBlur = 0; }

  function rr(x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function lighten(hex, amt = 40) {
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt);
    return `rgb(${r},${g},${b})`;
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(cx, base + lh + H*0.02, bw*0.65, H*0.03, 0, 0, Math.PI*2); ctx.fill();

  // Legs
  glow('legs_color');
  rr(cx - bw/2 + bw*0.06, legY, lw, lh, W*0.04, character.legs_color);
  rr(cx + bw/2 - lw - bw*0.06, legY, lw, lh, W*0.04, character.legs_color);
  noGlow();

  // Torso
  glow('torso_color');
  rr(cx - bw/2, torsoY, bw, th, W*0.05, character.torso_color);
  // torso shine
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(cx - bw/2, torsoY, bw, th*0.4, [W*0.05, W*0.05, 0, 0]); ctx.fill();
  noGlow();

  // Arms
  glow('arms_color');
  rr(cx - bw/2 - aw - W*0.01, armY, aw, ah, W*0.04, character.arms_color);
  rr(cx + bw/2 + W*0.01,       armY, aw, ah, W*0.04, character.arms_color);
  noGlow();

  // Head
  glow('head_color');
  rr(cx - hw/2, headY, hw, hh, W*0.07, character.head_color);
  // head shine
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.ellipse(cx - hw*0.12, headY + hh*0.22, hw*0.18, hh*0.1, -0.4, 0, Math.PI*2); ctx.fill();
  noGlow();

  // Hair
  ctx.shadowBlur = 0;
  const hairColor = lighten(character.head_color, -60);
  if (character.hair_style === 'default') {
    rr(cx - hw/2, headY - H*0.015, hw, H*0.05, [W*0.06, W*0.06, 0, 0], hairColor);
  } else if (character.hair_style === 'spiky') {
    ctx.fillStyle = hairColor;
    for (let i = 0; i < 5; i++) {
      const sx = cx - hw*0.38 + i * hw*0.2;
      ctx.beginPath();
      ctx.moveTo(sx, headY + H*0.01);
      ctx.lineTo(sx - hw*0.09, headY - H*0.055);
      ctx.lineTo(sx + hw*0.09, headY - H*0.055);
      ctx.closePath(); ctx.fill();
    }
  } else if (character.hair_style === 'long') {
    rr(cx - hw/2, headY - H*0.02, hw, H*0.08, [W*0.06, W*0.06, 0, 0], hairColor);
    // side strands
    rr(cx - hw/2 - W*0.025, headY, W*0.055, H*0.14, W*0.03, hairColor);
    rr(cx + hw/2 - W*0.03,  headY, W*0.055, H*0.14, W*0.03, hairColor);
  }

  // Face
  const eyeY = headY + hh * 0.38;
  const eyeX1 = cx - hw * 0.22, eyeX2 = cx + hw * 0.22;
  const eyeR  = W * 0.04;

  // Eyes white
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(eyeX1, eyeY, eyeR, eyeR*1.1, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(eyeX2, eyeY, eyeR, eyeR*1.1, 0, 0, Math.PI*2); ctx.fill();
  // Pupils
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.ellipse(eyeX1+W*0.005, eyeY+H*0.005, eyeR*0.55, eyeR*0.65, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(eyeX2+W*0.005, eyeY+H*0.005, eyeR*0.55, eyeR*0.65, 0, 0, Math.PI*2); ctx.fill();
  // Shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(eyeX1 - W*0.006, eyeY - H*0.008, W*0.012, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(eyeX2 - W*0.006, eyeY - H*0.008, W*0.012, 0, Math.PI*2); ctx.fill();

  // Mouth
  const mouthY = headY + hh * 0.7;
  ctx.lineWidth   = W * 0.022;
  ctx.strokeStyle = lighten(character.head_color, -80);
  ctx.lineCap = 'round';

  if (character.face_emotion === 'smile') {
    ctx.beginPath();
    ctx.arc(cx, mouthY - H*0.01, hw*0.22, 0.1*Math.PI, 0.9*Math.PI);
    ctx.stroke();
  } else if (character.face_emotion === 'happy') {
    ctx.beginPath();
    ctx.arc(cx, mouthY - H*0.015, hw*0.28, 0.05*Math.PI, 0.95*Math.PI);
    ctx.stroke();
    // rosy cheeks
    ctx.fillStyle = 'rgba(255,120,120,0.25)';
    ctx.beginPath(); ctx.ellipse(eyeX1 - W*0.01, mouthY - H*0.02, W*0.055, H*0.025, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(eyeX2 + W*0.01, mouthY - H*0.02, W*0.055, H*0.025, 0, 0, Math.PI*2); ctx.fill();
  } else if (character.face_emotion === 'serious') {
    ctx.beginPath();
    ctx.moveTo(cx - hw*0.22, mouthY);
    ctx.lineTo(cx + hw*0.22, mouthY);
    ctx.stroke();
    // stern brows
    ctx.lineWidth = W*0.02;
    ctx.beginPath(); ctx.moveTo(eyeX1-eyeR*1.1, eyeY-eyeR*1.5); ctx.lineTo(eyeX1+eyeR*0.8, eyeY-eyeR*1.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(eyeX2-eyeR*0.8, eyeY-eyeR*1.1); ctx.lineTo(eyeX2+eyeR*1.1, eyeY-eyeR*1.5); ctx.stroke();
  } else { // cool
    // shades
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.beginPath(); ctx.roundRect(eyeX1-eyeR*1.3, eyeY-eyeR*1.1, eyeR*2.6, eyeR*2, W*0.02); ctx.fill();
    ctx.beginPath(); ctx.roundRect(eyeX2-eyeR*1.3, eyeY-eyeR*1.1, eyeR*2.6, eyeR*2, W*0.02); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.roundRect(eyeX1-eyeR*1.3, eyeY-eyeR*1.1, eyeR*2.6, eyeR*0.7, [W*0.02,W*0.02,0,0]); ctx.fill();
    ctx.beginPath(); ctx.roundRect(eyeX2-eyeR*1.3, eyeY-eyeR*1.1, eyeR*2.6, eyeR*0.7, [W*0.02,W*0.02,0,0]); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = W*0.01;
    ctx.beginPath(); ctx.moveTo(eyeX1+eyeR*1.3, eyeY-eyeR*0.1); ctx.lineTo(eyeX2-eyeR*1.3, eyeY-eyeR*0.1); ctx.stroke();
    // smirk
    ctx.strokeStyle = lighten(character.head_color, -80); ctx.lineWidth = W*0.022;
    ctx.beginPath(); ctx.arc(cx+hw*0.08, mouthY-H*0.005, hw*0.14, 0.1*Math.PI, 0.9*Math.PI); ctx.stroke();
  }

  // Name tag
  if (character.name) {
    const nameY = base + lh + H * 0.055;
    ctx.fillStyle = 'rgba(162,60,245,0.15)';
    const tw = ctx.measureText(character.name).width;
    const nw = tw + W*0.16, nh = H*0.05;
    ctx.beginPath(); ctx.roundRect(cx - nw/2, nameY - nh/2, nw, nh, nh/2); ctx.fill();
    ctx.fillStyle = '#c97eff';
    ctx.font = `${Math.round(W*0.072)}px -apple-system,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(character.name, cx, nameY);
  }
}

// ── Current glow part based on attr ─────────────────────────────
function glowPartForAttr(attr) {
  const map = {
    legs_color: 'legs_color', torso_color: 'torso_color',
    arms_color: 'arms_color', head_color: 'head_color',
  };
  return map[attr.key] || null;
}

function redraw() {
  const attr = ATTRS[attrIdx];
  drawCharacter(glowPartForAttr(attr));
}

// ── Dots ─────────────────────────────────────────────────────────
function buildDots() {
  const container = document.getElementById('dots');
  container.innerHTML = '';
  ATTRS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === attrIdx ? ' active' : '');
    container.appendChild(d);
  });
}
function updateDots() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, i) => d.classList.toggle('active', i === attrIdx));
}

// ── Value display ─────────────────────────────────────────────────
function currentValueIdx() {
  const attr = ATTRS[attrIdx];
  if (attr.type === 'text') return -1;
  if (attr.type === 'color') return COLORS.indexOf(character[attr.key]);
  return attr.values.findIndex(v => v.id === character[attr.key]);
}

function renderValDisplay(animClass) {
  const attr = ATTRS[attrIdx];
  const disp = document.getElementById('val-display');
  const nameWrap = document.getElementById('name-wrap');
  const valNav   = document.getElementById('val-nav');

  if (attr.type === 'text') {
    nameWrap.classList.add('active');
    valNav.style.display = 'none';
    document.getElementById('name-input').value = character.name;
    return;
  }
  nameWrap.classList.remove('active');
  valNav.style.display = 'flex';

  disp.innerHTML = '';
  disp.className = '';
  if (animClass) {
    // force reflow for re-trigger
    void disp.offsetWidth;
    disp.classList.add(animClass);
  }

  if (attr.type === 'color') {
    const swatch = document.createElement('div');
    swatch.className = 'val-swatch';
    swatch.style.background = character[attr.key];
    swatch.style.marginRight = '10px';
    disp.appendChild(swatch);

    const lbl = document.createElement('span');
    lbl.className = 'val-label';
    const idx = currentValueIdx();
    lbl.textContent = `Цвет ${idx + 1} / ${COLORS.length}`;
    disp.appendChild(lbl);
  } else {
    const opt = attr.values.find(v => v.id === character[attr.key]);
    const lbl = document.createElement('span');
    lbl.className = 'val-label';
    lbl.style.fontSize = '20px';
    lbl.textContent = opt ? opt.label : '';
    disp.appendChild(lbl);
  }
}

function renderAttrName(animClass) {
  const el = document.getElementById('attr-name');
  el.className = '';
  void el.offsetWidth;
  if (animClass) el.classList.add(animClass);
  el.textContent = ATTRS[attrIdx].label;
}

// ── Navigate attributes (up/down) ────────────────────────────────
function goAttr(dir) {
  attrIdx = (attrIdx + dir + ATTRS.length) % ATTRS.length;
  renderAttrName(dir > 0 ? 'anim-down' : 'anim-up');
  renderValDisplay(dir > 0 ? 'anim-right' : 'anim-left');
  updateDots();
  redraw();
}

// ── Navigate values (left/right) ─────────────────────────────────
function goVal(dir) {
  const attr = ATTRS[attrIdx];
  if (attr.type === 'text') return;

  const vals = attr.values;
  const idx  = currentValueIdx();
  const next = (idx + dir + vals.length) % vals.length;

  if (attr.type === 'color') {
    character[attr.key] = COLORS[next];
  } else {
    character[attr.key] = vals[next].id;
  }

  renderValDisplay(dir > 0 ? 'anim-right' : 'anim-left');
  redraw();
}

// ── Button wiring ─────────────────────────────────────────────────
document.getElementById('attr-up').addEventListener('click',   () => goAttr(-1));
document.getElementById('attr-down').addEventListener('click', () => goAttr(1));
document.getElementById('val-prev').addEventListener('click',  () => goVal(-1));
document.getElementById('val-next').addEventListener('click',  () => goVal(1));

document.getElementById('name-input').addEventListener('input', e => {
  character.name = e.target.value;
  redraw();
});

// ── Keyboard ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')    { goAttr(-1); e.preventDefault(); }
  if (e.key === 'ArrowDown')  { goAttr(1);  e.preventDefault(); }
  if (e.key === 'ArrowLeft')  { goVal(-1);  e.preventDefault(); }
  if (e.key === 'ArrowRight') { goVal(1);   e.preventDefault(); }
});

// ── Touch swipe on canvas / controls ─────────────────────────────
let tx0 = 0, ty0 = 0;
const swipeTarget = document.getElementById('app');

swipeTarget.addEventListener('touchstart', e => {
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
}, { passive: true });

swipeTarget.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
  if (Math.abs(dy) > Math.abs(dx)) {
    // vertical → attr
    goAttr(dy > 0 ? 1 : -1);
  } else {
    // horizontal → value
    goVal(dx > 0 ? 1 : -1);
  }
}, { passive: true });

// ── Save ──────────────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', () => {
  character.name = document.getElementById('name-input').value.trim() || character.name;
  localStorage.setItem('batm_character', JSON.stringify(character));

  const btn = document.getElementById('save-btn');
  btn.textContent = '✅ Сохранено';
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = '💾 Сохранить'; btn.classList.remove('saved'); }, 2000);

  if (tg) tg.sendData(JSON.stringify(character));
});

// ── Canvas float animation ────────────────────────────────────────
canvas.classList.add('floating');

// ── Init ──────────────────────────────────────────────────────────
buildDots();
renderAttrName();
renderValDisplay();
redraw();

window.addEventListener('resize', () => { resizeCanvas(); redraw(); });
</script>
</body>
</html>
