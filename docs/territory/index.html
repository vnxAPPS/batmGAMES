<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Битва за территорию</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#1a1c2a; --panel:#222436; --border:rgba(255,255,255,0.08);
  --text:#f2f4ff; --muted:#8b92b0;
  --blue:#3b9eff; --red:#ff4b4b; --neutral:#555c7a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-tap-highlight-color:transparent;}
#wrap{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-shrink:0;}
.back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;
  text-decoration:none;border-radius:10px;background:rgba(255,112,0,0.12);
  border:1px solid rgba(255,112,0,0.35);box-shadow:0 0 10px rgba(255,112,0,0.25);
  transition:all 0.15s;flex-shrink:0;}
.back-btn:active{transform:scale(0.92);}
.back-arrow{display:block;width:14px;height:14px;border-left:2.5px solid #ff7000;
  border-bottom:2.5px solid #ff7000;transform:rotate(45deg) translateX(2px);
  filter:drop-shadow(0 0 4px #ff7000);}
#topbar h1{font-size:14px;font-weight:800;flex:1;text-align:center;}
#turn-info{font-size:11px;color:var(--muted);white-space:nowrap;}
#bar-wrap{padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
#powerbar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;}
#bar-blue{background:var(--blue);transition:flex .5s;min-width:3px;}
#bar-red{background:var(--red);transition:flex .5s;min-width:3px;}
#bar-gray{background:var(--neutral);flex:1;}
#bar-labels{display:flex;justify-content:space-between;margin-top:3px;font-size:10px;color:var(--muted);}
#canvas-wrap{flex:1;position:relative;overflow:hidden;touch-action:none;}
#map{width:100%;height:100%;touch-action:none;cursor:default;display:block;}
#log{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:rgba(20,22,38,0.92);backdrop-filter:blur(6px);
  border:1px solid var(--border);border-radius:12px;
  padding:6px 14px;font-size:12px;font-weight:700;color:#fff;
  pointer-events:none;opacity:0;transition:opacity .3s;
  white-space:nowrap;max-width:90%;text-overflow:ellipsis;overflow:hidden;}
#log.show{opacity:1;}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(59,158,255,0.12);border:1px solid rgba(59,158,255,0.32);
  border-radius:10px;padding:6px 14px;font-size:11px;color:rgba(59,158,255,0.95);
  pointer-events:none;opacity:1;transition:opacity .6s;white-space:nowrap;}
#hint.hidden{opacity:0;}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:rgba(12,14,24,0.93);backdrop-filter:blur(6px);
  text-align:center;padding:24px;z-index:10;}
#overlay.hidden{display:none;}
#overlay h2{font-size:24px;font-weight:800;line-height:1.25;}
#overlay p{font-size:13px;color:var(--muted);max-width:300px;line-height:1.6;}
.player-badge{display:inline-flex;align-items:center;gap:8px;
  background:rgba(59,158,255,0.14);border:1px solid rgba(59,158,255,0.4);
  border-radius:999px;padding:8px 18px;font-size:13px;font-weight:700;}
.player-dot{width:14px;height:14px;border-radius:50%;background:#3b9eff;
  box-shadow:0 0 8px rgba(59,158,255,0.7);flex-shrink:0;}
.big-btn{padding:14px 36px;border:none;border-radius:14px;font:inherit;
  font-weight:800;font-size:15px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#3b9eff,#1a6fc4);
  box-shadow:0 6px 24px rgba(59,158,255,.45);}
.big-btn:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <a class="back-btn" href="../"><span class="back-arrow"></span></a>
    <h1>⚔️ Битва за территорию</h1>
    <span id="turn-info">Твой ход</span>
  </div>
  <div id="bar-wrap">
    <div id="powerbar">
      <div id="bar-blue" style="flex:1"></div>
      <div id="bar-red"  style="flex:1"></div>
      <div id="bar-gray" style="flex:1"></div>
    </div>
    <div id="bar-labels">
      <span id="lbl-blue">🔵 Ты: 1</span>
      <span id="lbl-neutral">⬜ 14</span>
      <span id="lbl-red">🤖 Враг: 1</span>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="map"></canvas>
    <div id="log"></div>
    <div id="hint">Перетяни с синей зоны на соседнюю</div>
    <div id="overlay">
      <h2>⚔️ Битва за<br>территорию</h2>
      <div class="player-badge"><div class="player-dot"></div>Ты — синий 🔵</div>
      <p>Перетяни с <b style="color:#3b9eff">синей зоны</b> на соседнюю — атакуй врага или перебрось войска между своими.</p>
      <button class="big-btn" id="ov-btn">▶ Начать</button>
    </div>
  </div>
</div>
<script>
"use strict";
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

// Simplified map: 9 towers, clearer layout
const TOWERS=[
  {id:0,x:.15,y:.20,name:"Север"},
  {id:1,x:.50,y:.15,name:"Гора"},
  {id:2,x:.85,y:.25,name:"Восток"},
  {id:3,x:.20,y:.50,name:"Запад"},
  {id:4,x:.50,y:.50,name:"Центр"},
  {id:5,x:.80,y:.50,name:"Форт"},
  {id:6,x:.25,y:.80,name:"Долина"},
  {id:7,x:.55,y:.75,name:"Мост"},
  {id:8,x:.85,y:.85,name:"Юг"},
];
const ADJ={
  0:[1,3],     1:[0,2,4],     2:[1,5],
  3:[0,4,6],   4:[1,3,5,7],   5:[2,4,8],
  6:[3,7],     7:[4,6,8],     8:[5,7],
};
const PLAYERS=[
  {id:0,name:"Ты",   color:"#3b9eff",darkColor:"#1a5ca8",isHuman:true},
  {id:1,name:"Враг", color:"#ff4b4b",darkColor:"#a82020",isHuman:false},
];
const NEUTRAL={id:2,color:"#555c7a",darkColor:"#3a405a"};

let towers,units,gamePhase,logTimer,hintHidden,prodTimer;
let dragFrom=null,dragPos=null,dragHover=null,animFrame=null;

function initGame(){
  towers=TOWERS.map(t=>({...t,owner:2,units:8}));
  units=[];
  gamePhase="play"; hintHidden=false; prodTimer=0;
  dragFrom=null; dragPos=null; dragHover=null;
  towers[0].owner=0; towers[0].units=20;  // player starts strong
  towers[8].owner=1; towers[8].units=15;  // AI in opposite corner
  document.getElementById("hint").classList.remove("hidden");
}

// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas=document.getElementById("map"),ctx=canvas.getContext("2d");
let W=0,H=0;
function resize(){
  const wrap=document.getElementById("canvas-wrap");
  W=wrap.clientWidth; H=wrap.clientHeight;
  canvas.width=W; canvas.height=H; draw();
}
window.addEventListener("resize",resize);
const rx=x=>x*W, ry=y=>y*H;
function ownerStyle(t){return t.owner===2?NEUTRAL:PLAYERS[t.owner];}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#1e2235"; ctx.fillRect(0,0,W,H);

  // ocean dots background
  ctx.fillStyle="rgba(59,158,255,0.05)";
  for(let xi=0;xi<W;xi+=40)for(let yi=0;yi<H;yi+=40){
    ctx.beginPath();ctx.arc(xi+20,yi+20,6,0,Math.PI*2);ctx.fill();
  }

  // connections between towers (static lines)
  ctx.strokeStyle="rgba(255,255,255,0.08)";ctx.lineWidth=1.5;
  for(let id in ADJ){
    const from=towers[id];
    ADJ[id].forEach(tid=>{
      const to=towers[tid];
      ctx.beginPath();
      ctx.moveTo(rx(from.x),ry(from.y));
      ctx.lineTo(rx(to.x),ry(to.y));
      ctx.stroke();
    });
  }

  // moving unit groups
  units.forEach(u=>{
    const style=ownerStyle({owner:u.owner});
    ctx.fillStyle=style.color+"aa";
    ctx.beginPath();
    ctx.arc(u.x,u.y,Math.min(18,6+u.amount/3),0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#fff";
    ctx.font="700 11px system-ui";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(u.amount,u.x,u.y);
  });

  // towers
  towers.forEach(t=>{
    const style=ownerStyle(t);
    const isFrom=t.id===dragFrom;
    const isHover=dragFrom!==null&&t.id===dragHover&&t.id!==dragFrom;
    const isValid=dragFrom!==null&&ADJ[dragFrom]?.includes(t.id);

    const tx=rx(t.x),ty=ry(t.y);
    const rad=Math.min(W,H)*0.065;

    ctx.save();
    if(isFrom){ctx.shadowColor=style.color;ctx.shadowBlur=22;}
    else if(isHover&&isValid){ctx.shadowColor="#fff";ctx.shadowBlur=20;}

    // tower circle
    ctx.beginPath();ctx.arc(tx,ty,rad,0,Math.PI*2);
    ctx.fillStyle=style.color+(isFrom||isValid?"ff":"cc");
    ctx.fill();

    if(isFrom||(isHover&&isValid)){ctx.strokeStyle="#fff";ctx.lineWidth=3;}
    else if(isValid){ctx.strokeStyle="rgba(255,255,255,0.55)";ctx.lineWidth=2;}
    else{ctx.strokeStyle="rgba(255,255,255,0.18)";ctx.lineWidth=1.5;}
    ctx.stroke();
    ctx.restore();

    // inner circle with units
    ctx.beginPath();ctx.arc(tx,ty,rad*0.7,0,Math.PI*2);
    ctx.fillStyle=t.owner===2?"rgba(255,255,255,0.88)":style.darkColor;
    ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.3)";ctx.lineWidth=1.5;ctx.stroke();

    ctx.fillStyle=t.owner===2?"#222":"#fff";
    ctx.font=`800 ${Math.round(rad*0.5)}px system-ui`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(t.units,tx,ty);
  });

  drawDragLine();
  updateBar();
}

function drawDragLine(){
  if(dragFrom===null||dragPos===null)return;
  const fr=towers[dragFrom];
  const x1=rx(fr.x),y1=ry(fr.y),x2=dragPos.x,y2=dragPos.y;
  const dist=Math.hypot(x2-x1,y2-y1);
  if(dist<12)return;
  const angle=Math.atan2(y2-y1,x2-x1);
  const isValid=dragHover!==null&&dragHover!==dragFrom&&ADJ[dragFrom]?.includes(dragHover);
  const col=isValid?"rgba(255,255,255,0.92)":"rgba(255,255,255,0.4)";

  ctx.save();
  ctx.strokeStyle=col;ctx.lineWidth=3;
  ctx.setLineDash([8,5]);
  ctx.lineDashOffset=-((Date.now()/55)%13);
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2-18*Math.cos(angle),y2-18*Math.sin(angle));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-18*Math.cos(angle-0.44),y2-18*Math.sin(angle-0.44));
  ctx.lineTo(x2-11*Math.cos(angle),     y2-11*Math.sin(angle));
  ctx.lineTo(x2-18*Math.cos(angle+0.44),y2-18*Math.sin(angle+0.44));
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function animLoop(){
  if(dragFrom!==null){draw();animFrame=requestAnimationFrame(animLoop);}
}

// ── UI helpers ──────────────────────────────────────────────────────────────
function updateBar(){
  const c=[0,0,0];towers.forEach(t=>c[t.owner]++);
  document.getElementById("bar-blue").style.flex=c[0];
  document.getElementById("bar-red").style.flex=c[1];
  document.getElementById("bar-gray").style.flex=c[2];
  document.getElementById("lbl-blue").textContent="🔵 Ты: "+c[0];
  document.getElementById("lbl-red").textContent="🤖 Враг: "+c[1];
  document.getElementById("lbl-neutral").textContent="⬜ "+(c[2]||"");
}
function showLog(msg,dur=1800){
  const el=document.getElementById("log");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(logTimer);
  logTimer=setTimeout(()=>el.classList.remove("show"),dur);
}
function hideHint(){
  if(hintHidden)return;hintHidden=true;
  document.getElementById("hint").classList.add("hidden");
}

// ── Game loop ────────────────────────────────────────────────────────────────
let lastTime=0;
function gameLoop(now){
  if(gamePhase!=="play")return;
  const dt=Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  // production: +1 unit/sec per tower
  prodTimer+=dt;
  if(prodTimer>=1){
    prodTimer-=1;
    towers.forEach(t=>{
      if(t.owner!==2)t.units++;
    });
  }

  // move units
  units.forEach(u=>{
    const dx=u.targetX-u.x,dy=u.targetY-u.y;
    const dist=Math.hypot(dx,dy);
    if(dist<3){u.arrived=true;return;}
    const speed=dt*180;
    u.x+=dx/dist*speed;
    u.y+=dy/dist*speed;
  });

  // handle arrivals
  units.filter(u=>u.arrived).forEach(u=>{
    const target=towers[u.targetId];
    if(target.owner===u.owner){
      target.units+=u.amount;
    }else{
      target.units-=u.amount;
      if(target.units<0){
        target.owner=u.owner;
        target.units=Math.abs(target.units);
        showLog(`🏴 ${towers[u.fromId].name} захватил ${target.name}!`,2200);
        if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred("medium");
      }
    }
  });
  units=units.filter(u=>!u.arrived);

  checkWin();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame(){
  initGame();resize();lastTime=performance.now();
  gamePhase="play";
  requestAnimationFrame(gameLoop);
}

// ── Pointer events (drag-to-attack) ─────────────────────────────────────────
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
  return{mx:(e.clientX-rect.left)*sx,my:(e.clientY-rect.top)*sy};
}

canvas.addEventListener("pointerdown",e=>{
  if(gamePhase!=="play")return;
  e.preventDefault();
  const{mx,my}=getPos(e);
  const hit=towers.find(t=>{
    const tx=rx(t.x),ty=ry(t.y),rad=Math.min(W,H)*0.065;
    return Math.hypot(mx-tx,my-ty)<rad;
  });
  if(hit&&hit.owner===0&&hit.units>1){
    dragFrom=hit.id;dragPos={x:mx,y:my};dragHover=null;
    canvas.setPointerCapture(e.pointerId);
    hideHint();
    cancelAnimationFrame(animFrame);animLoop();
  }
},{passive:false});

canvas.addEventListener("pointermove",e=>{
  if(dragFrom===null)return;
  e.preventDefault();
  const{mx,my}=getPos(e);
  dragPos={x:mx,y:my};
  dragHover=towers.find(t=>{
    const tx=rx(t.x),ty=ry(t.y),rad=Math.min(W,H)*0.065;
    return Math.hypot(mx-tx,my-ty)<rad;
  })?.id??null;
},{passive:false});

canvas.addEventListener("pointerup",e=>{
  if(dragFrom===null)return;
  e.preventDefault();
  const{mx,my}=getPos(e);
  const tgt=towers.find(t=>{
    const tx=rx(t.x),ty=ry(t.y),rad=Math.min(W,H)*0.065;
    return Math.hypot(mx-tx,my-ty)<rad;
  });
  if(tgt&&tgt.id!==dragFrom&&ADJ[dragFrom]?.includes(tgt.id)){
    const from=towers[dragFrom];
    const amount=Math.floor(from.units/2);
    if(amount>0){
      from.units-=amount;
      units.push({
        x:rx(from.x),y:ry(from.y),
        targetX:rx(tgt.x),targetY:ry(tgt.y),
        targetId:tgt.id,fromId:from.id,
        amount,owner:0,arrived:false
      });
      setTimeout(aiTurn,900);
    }
  }
  cancelAnimationFrame(animFrame);
  dragFrom=null;dragPos=null;dragHover=null;draw();
},{passive:false});

canvas.addEventListener("pointercancel",()=>{
  cancelAnimationFrame(animFrame);
  dragFrom=null;dragPos=null;dragHover=null;draw();
});

// ── AI turn ───────────────────────────────────────────────────────────────────
function aiTurn(){
  if(gamePhase!=="play")return;
  const mine=towers.filter(t=>t.owner===1&&t.units>2);
  if(!mine.length)return;

  let best=null,bestScore=-Infinity;
  mine.forEach(t=>{
    ADJ[t.id].forEach(nid=>{
      const nb=towers[nid];
      if(nb.owner!==1){
        const score=t.units-nb.units+(nb.owner===0?10:5);
        if(score>bestScore){bestScore=score;best={from:t,to:nb};}
      }
    });
  });

  if(best&&best.from.units>2){
    const amount=Math.floor(best.from.units*0.6);
    best.from.units-=amount;
    units.push({
      x:rx(best.from.x),y:ry(best.from.y),
      targetX:rx(best.to.x),targetY:ry(best.to.y),
      targetId:best.to.id,fromId:best.from.id,
      amount,owner:1,arrived:false
    });
  }
}

function checkWin(){
  if(gamePhase!=="play")return;
  const c=[0,0];towers.forEach(t=>{if(t.owner<2)c[t.owner]++;});
  if(c[1]===0)endGame(true);
  else if(c[0]===0)endGame(false);
}

function endGame(won){
  gamePhase="gameover";
  document.querySelector("#overlay h2").textContent=won?"🏆 Победа!":"💀 Поражение";
  document.querySelector("#overlay p").textContent=won
    ?"Ты завоевал все башни!"
    :"Враг захватил твои территории. Попробуешь снова?";
  document.querySelector(".player-badge").style.display="none";
  document.getElementById("ov-btn").textContent="🔄 Ещё раз";
  document.getElementById("overlay").classList.remove("hidden");
  if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred(won?"success":"error");
}

// ── Start ─────────────────────────────────────────────────────────────────────
document.getElementById("ov-btn").addEventListener("click",()=>{
  document.getElementById("overlay").classList.add("hidden");
  document.querySelector(".player-badge").style.display="";
  document.querySelector("#overlay h2").textContent="⚔️ Битва за\nтерриторию";
  startGame();
  showLog("🗺 Перетяни синюю башню на соседнюю — атакуй!",2500);
});

window.addEventListener("resize",resize);
initGame();resize();
</script>
</body>
</html>
