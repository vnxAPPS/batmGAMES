<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetris 🟦 — batmGAMES</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg1: #05070c;
  --bg2: #0a0d12;
  --card: #161d2b;
  --text: #f2f4ff;
  --muted: #8b92b0;
  --border: rgba(255,255,255,0.07);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; width:100%;
  background:var(--bg1); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden; user-select:none; -webkit-tap-highlight-color:transparent;
}
#app { display:flex; flex-direction:column; height:100vh; max-width:480px; margin:0 auto; }

/* ── Topbar ── */
#topbar {
  display:flex; align-items:center; padding:8px 14px; gap:10px;
  background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0;
  z-index:20;
}
.back-btn {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; text-decoration:none; border-radius:10px;
  background:rgba(255,112,0,0.12); border:1px solid rgba(255,112,0,0.35);
  box-shadow:0 0 10px rgba(255,112,0,0.25),inset 0 0 8px rgba(255,112,0,0.08);
  transition:all 0.15s; flex-shrink:0;
}
.back-btn:active { transform:scale(0.92); box-shadow:0 0 18px rgba(255,112,0,0.5); }
.back-arrow {
  display:block; width:14px; height:14px;
  border-left:2.5px solid #ff7000; border-bottom:2.5px solid #ff7000;
  transform:rotate(45deg) translateX(2px); filter:drop-shadow(0 0 4px #ff7000);
}
#topbar-title { flex:1; text-align:center; font-size:15px; font-weight:800; }
.score-pill {
  padding:5px 14px; background:var(--card); border-radius:999px;
  border:1px solid var(--border); font-size:14px; font-weight:800;
  color:#ff7000; white-space:nowrap; min-width:48px; text-align:center;
}

/* ── Board wrap — fills all remaining space ── */
#board-wrap {
  flex:1 1 0; position:relative;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; background:var(--bg1);
}
#board {
  display:block; border-radius:0;
  image-rendering:crisp-edges;
}

/* ── Stats overlay (top-left) ── */
#stats-overlay {
  position:absolute; top:10px; left:10px;
  display:flex; flex-direction:column; gap:6px;
  z-index:10; pointer-events:none;
}
.stat-pill {
  background:rgba(5,7,12,0.72);
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:5px 10px;
  display:flex; flex-direction:column; align-items:center; min-width:56px;
}
.stat-val { font-size:18px; font-weight:900; color:#ff7000; line-height:1.1; }
.stat-lbl { font-size:8px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }

/* ── Next piece overlay (top-right) ── */
#next-overlay {
  position:absolute; top:10px; right:10px;
  background:rgba(5,7,12,0.72);
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:8px 10px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  z-index:10; pointer-events:none;
}
#next-overlay .stat-lbl { font-size:8px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }

/* ── D-pad overlay (показывается один раз при старте, исчезает через 5с) ── */
/*
  Стандартная раскладка (как на клавиатуре):
      [  ↑  ]
  [←] [↓⚡] [→]
  ↑ = поворот (центр вверху), ← ↓ → — нижний ряд
*/
#dpad {
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  display:grid;
  grid-template-columns:56px 56px 56px;
  grid-template-rows:56px 56px;
  gap:8px; z-index:15;
  opacity:1; transition:opacity 1s ease;
}
#dpad.dpad-hidden { opacity:0; pointer-events:none; }
.dp {
  width:56px; height:56px;
  background:rgba(5,7,12,0.72);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.13); border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; cursor:pointer;
  transition:transform .1s, background .1s, box-shadow .1s;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 2px 14px rgba(0,0,0,0.45);
}
.dp:active { transform:scale(.86); background:rgba(255,112,0,0.18); box-shadow:0 0 18px rgba(255,112,0,0.35); }

/* ↑/↻ — row 1 col 2 (центр сверху = поворот) */
#dp-rot   { grid-column:2; grid-row:1; color:#ff7000; font-size:17px; font-weight:900;
  border-color:rgba(255,112,0,0.25); box-shadow:0 0 10px rgba(255,112,0,0.15); }
/* ← — row 2 col 1 */
#dp-left  { grid-column:1; grid-row:2; }
/* ↓ — row 2 col 2 — ускорение */
#dp-down  { grid-column:2; grid-row:2; position:relative; flex-direction:column; gap:0;
  font-size:17px; font-weight:900; color:#ffd23e;
  border-color:rgba(255,210,62,0.25); }
#dp-down::after { content:'ускор.'; position:absolute; bottom:5px;
  font-size:7px; font-weight:700; color:rgba(255,210,62,0.65); letter-spacing:.04em; }
/* → — row 2 col 3 */
#dp-right { grid-column:3; grid-row:2; }

/* ── Game overlay (start / game over) ── */
.overlay {
  position:absolute; inset:0;
  background:rgba(5,7,12,0.88); backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; z-index:30;
}
.overlay.hidden { display:none; }
.ov-emoji  { font-size:52px; line-height:1; }
.ov-title  { font-size:24px; font-weight:900; }
.ov-sub    { font-size:13px; color:var(--muted); text-align:center; padding:0 24px; line-height:1.5; }
.play-btn  {
  margin-top:8px; padding:14px 44px;
  background:linear-gradient(135deg,#ff7000 0%,#ff4500 100%);
  color:#fff; border:none; border-radius:999px;
  font-size:16px; font-weight:800; cursor:pointer; letter-spacing:.04em;
  box-shadow:0 4px 24px rgba(255,112,0,0.45), 0 0 0 1px rgba(255,112,0,0.3);
  transition:transform .12s, box-shadow .12s;
}
.play-btn:active { transform:scale(0.96); box-shadow:0 2px 12px rgba(255,112,0,0.6); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a class="back-btn" href="../"><span class="back-arrow"></span></a>
    <div id="topbar-title">🟦 Tetris</div>
    <div class="score-pill" id="score-top">0</div>
  </div>

  <div id="board-wrap">
    <canvas id="board"></canvas>

    <!-- Stats: top-left -->
    <div id="stats-overlay">
      <div class="stat-pill">
        <span class="stat-val" id="level-val">1</span>
        <span class="stat-lbl">Уровень</span>
      </div>
      <div class="stat-pill">
        <span class="stat-val" id="lines-val">0</span>
        <span class="stat-lbl">Линий</span>
      </div>
      <div class="stat-pill">
        <span class="stat-val" id="best-val">0</span>
        <span class="stat-lbl">Рекорд</span>
      </div>
    </div>

    <!-- Next piece: top-right -->
    <div id="next-overlay">
      <span class="stat-lbl">След.</span>
      <canvas id="next-canvas" width="52" height="52"></canvas>
    </div>

    <!-- D-pad (fades after 3s) -->
    <div id="dpad">
      <div class="dp" id="dp-rot">↻</div>
      <div class="dp" id="dp-left">←</div>
      <div class="dp" id="dp-down">↓</div>
      <div class="dp" id="dp-right">→</div>
    </div>

    <!-- Start / Game Over overlay -->
    <div class="overlay" id="overlay">
      <div class="ov-emoji">🟦</div>
      <div class="ov-title">Tetris</div>
      <div class="ov-sub">Свайп — движение · Тап — поворот<br>Двойной тап — сброс</div>
      <button class="play-btn" id="start-btn">ИГРАТЬ</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Constants ──────────────────────────────────────────────────
const COLS = 10, ROWS = 20;
const COLORS = [
  null,
  '#00c2ff', // I — cyan
  '#ffd23e', // O — yellow
  '#a23cf5', // T — purple
  '#22c55e', // S — green
  '#ff4b4b', // Z — red
  '#3b9eff', // J — blue
  '#f97316', // L — orange
];
const PIECES = [
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[0,4,4],[4,4,0]],
  [[5,5,0],[0,5,5]],
  [[6,0,0],[6,6,6]],
  [[0,0,7],[7,7,7]],
];

// ── Canvas ──────────────────────────────────────────────────────
const boardCanvas = document.getElementById('board');
const ctx         = boardCanvas.getContext('2d');
const nextCanvas  = document.getElementById('next-canvas');
const nctx        = nextCanvas.getContext('2d');
const boardWrap   = document.getElementById('board-wrap');

let CS;

function sizeBoard() {
  const w = boardWrap.clientWidth;
  const h = boardWrap.clientHeight;
  CS = Math.floor(Math.min(h / ROWS, w / COLS));
  boardCanvas.width  = CS * COLS;
  boardCanvas.height = CS * ROWS;
}
sizeBoard();
window.addEventListener('resize', () => { sizeBoard(); drawBoard(); });

// ── D-pad: показать один раз при первом старте, скрыть навсегда через 5с ──
const dpad = document.getElementById('dpad');
let dpadShown = false;
function showDpadOnce() {
  if (dpadShown) return;
  dpadShown = true;
  dpad.classList.remove('dpad-hidden');
  setTimeout(() => dpad.classList.add('dpad-hidden'), 5000);
}

// ── State ──────────────────────────────────────────────────────
let board, piece, pieceX, pieceY, nextPiece;
let score, level, lines, best, running, ticker;

best = +localStorage.getItem('tetris_best') || 0;
document.getElementById('best-val').textContent = best;

// ── Helpers ────────────────────────────────────────────────────
function rng(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function newPiece() { return JSON.parse(JSON.stringify(rng(PIECES))); }

function rotate(p) {
  const rows = p.length, cols = p[0].length;
  const r = Array.from({length:cols}, () => Array(rows).fill(0));
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) r[x][rows-1-y] = p[y][x];
  return r;
}

function fits(p, ox, oy) {
  for (let y=0;y<p.length;y++)
    for (let x=0;x<p[y].length;x++)
      if (p[y][x]) {
        const nx=ox+x, ny=oy+y;
        if (nx<0||nx>=COLS||ny>=ROWS) return false;
        if (ny>=0 && board[ny][nx]) return false;
      }
  return true;
}

function place() {
  for (let y=0;y<piece.length;y++)
    for (let x=0;x<piece[y].length;x++)
      if (piece[y][x] && pieceY+y >= 0)
        board[pieceY+y][pieceX+x] = piece[y][x];
}

function clearLines() {
  let cleared = 0;
  for (let y=ROWS-1;y>=0;y--) {
    if (board[y].every(c=>c)) {
      board.splice(y,1); board.unshift(Array(COLS).fill(0));
      cleared++; y++;
    }
  }
  if (!cleared) return;
  lines += cleared;
  score += [0,100,300,500,800][cleared] * level;
  level  = Math.floor(lines/10)+1;
  updateUI();
  if (score > best) { best=score; localStorage.setItem('tetris_best',best); }
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function updateUI() {
  document.getElementById('score-top').textContent = score;
  document.getElementById('level-val').textContent = level;
  document.getElementById('lines-val').textContent = lines;
  document.getElementById('best-val').textContent  = best;
}

// ── Draw ───────────────────────────────────────────────────────
function cellColor(v) { return COLORS[v] || null; }

function drawCell(c, x, y, size, alpha=1) {
  if (!c) return;
  const px=x*size, py=y*size, s=size-1, r=Math.max(2, size*0.16);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.roundRect(px+.5, py+.5, s, s, r); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.roundRect(px+1.5, py+1.5, s*0.55, s*0.28, [r,r,0,0]); ctx.fill();
  ctx.globalAlpha = alpha * 0.45;
  ctx.strokeStyle = c; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(px+.5, py+.5, s, s, r); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawBoard() {
  ctx.clearRect(0,0,boardCanvas.width,boardCanvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5;
  for (let x=0;x<=COLS;x++) { ctx.beginPath();ctx.moveTo(x*CS,0);ctx.lineTo(x*CS,boardCanvas.height);ctx.stroke(); }
  for (let y=0;y<=ROWS;y++) { ctx.beginPath();ctx.moveTo(0,y*CS);ctx.lineTo(boardCanvas.width,y*CS);ctx.stroke(); }

  for (let y=0;y<ROWS;y++)
    for (let x=0;x<COLS;x++)
      if (board[y][x]) drawCell(cellColor(board[y][x]), x, y, CS);

  if (!running) return;

  // ghost
  let gy = pieceY;
  while (fits(piece, pieceX, gy+1)) gy++;
  if (gy !== pieceY)
    for (let y=0;y<piece.length;y++)
      for (let x=0;x<piece[y].length;x++)
        if (piece[y][x]) drawCell(cellColor(piece[y][x]), pieceX+x, gy+y, CS, 0.15);

  // active piece
  for (let y=0;y<piece.length;y++)
    for (let x=0;x<piece[y].length;x++)
      if (piece[y][x]) drawCell(cellColor(piece[y][x]), pieceX+x, pieceY+y, CS);
}

function drawNext() {
  nctx.clearRect(0,0,52,52);
  if (!nextPiece) return;
  const ns = Math.floor(52 / Math.max(nextPiece[0].length, nextPiece.length));
  const ox = Math.floor((52 - nextPiece[0].length*ns)/2);
  const oy = Math.floor((52 - nextPiece.length*ns)/2);
  for (let y=0;y<nextPiece.length;y++)
    for (let x=0;x<nextPiece[y].length;x++)
      if (nextPiece[y][x]) {
        const c=cellColor(nextPiece[y][x]);
        const px=ox+x*ns, py=oy+y*ns, s=ns-1;
        nctx.fillStyle=c;
        nctx.beginPath(); nctx.roundRect(px,py,s,s,2); nctx.fill();
        nctx.fillStyle='rgba(255,255,255,0.2)';
        nctx.beginPath(); nctx.roundRect(px+1,py+1,s*0.5,s*0.28,[2,2,0,0]); nctx.fill();
      }
}

// ── Game loop ──────────────────────────────────────────────────
function spawnPiece() {
  piece  = nextPiece || newPiece();
  pieceX = Math.floor((COLS - piece[0].length) / 2);
  pieceY = -piece.length + 1;
  nextPiece = newPiece();
  drawNext();
  if (!fits(piece, pieceX, pieceY)) { gameOver(); return false; }
  return true;
}

function drop() {
  if (!running) return;
  if (fits(piece, pieceX, pieceY+1)) { pieceY++; }
  else { place(); clearLines(); if (!spawnPiece()) return; }
  drawBoard();
}

function startGame() {
  sizeBoard();
  board = Array.from({length:ROWS}, () => Array(COLS).fill(0));
  score = 0; level = 1; lines = 0;
  nextPiece = newPiece();
  running = true;
  updateUI();
  document.getElementById('overlay').classList.add('hidden');
  clearInterval(ticker);
  spawnPiece();
  drawBoard();
  resetTicker();
  showDpadOnce(); // один раз при первом запуске
}

function resetTicker() {
  clearInterval(ticker);
  ticker = setInterval(drop, Math.max(80, 600 - (level-1)*50));
}

function gameOver() {
  running = false;
  clearInterval(ticker);
  if (score > best) { best=score; localStorage.setItem('tetris_best',best); updateUI(); }
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <div class="ov-emoji">💥</div>
    <div class="ov-title">Игра окончена</div>
    <div class="ov-sub">Счёт: <b style="color:#ff7000">${score}</b> · Рекорд: <b style="color:#ffd23e">${best}</b></div>
    <button class="play-btn" id="start-btn">ЕЩЁ РАЗ</button>
  `;
  ov.classList.remove('hidden');
  document.getElementById('start-btn').addEventListener('click', startGame);
}

// ── Controls ───────────────────────────────────────────────────
function moveLeft()    { if (running && fits(piece,pieceX-1,pieceY)) { pieceX--; drawBoard(); haptic('light'); } }
function moveRight()   { if (running && fits(piece,pieceX+1,pieceY)) { pieceX++; drawBoard(); haptic('light'); } }
function moveDown()    { if (running) { drop(); resetTicker(); } }
function rotatePiece() { if (!running) return; const r=rotate(piece); if(fits(r,pieceX,pieceY)){piece=r;drawBoard();haptic('medium');} }
function hardDrop()    {
  if (!running) return;
  while (fits(piece,pieceX,pieceY+1)) { pieceY++; score+=2; }
  drop(); resetTicker();
  document.getElementById('score-top').textContent = score;
  haptic('heavy');
}
function haptic(t) { if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(t); }

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft')  { moveLeft();   e.preventDefault(); }
  if (e.key==='ArrowRight') { moveRight();  e.preventDefault(); }
  if (e.key==='ArrowDown')  { moveDown();   e.preventDefault(); }
  if (e.key==='ArrowUp')    { rotatePiece();e.preventDefault(); }
  if (e.key===' ')          { hardDrop();   e.preventDefault(); }
});

// D-pad
document.getElementById('dp-rot').addEventListener('click',   rotatePiece);
document.getElementById('dp-left').addEventListener('click',  moveLeft);
document.getElementById('dp-down').addEventListener('click',  moveDown);
document.getElementById('dp-right').addEventListener('click', moveRight);
let dpDownTimer;
document.getElementById('dp-down').addEventListener('pointerdown', () => { dpDownTimer = setTimeout(hardDrop, 400); });
document.getElementById('dp-down').addEventListener('pointerup',   () => clearTimeout(dpDownTimer));

// Swipe on board
let tx=0,ty=0,lastTap=0;
boardCanvas.addEventListener('touchstart', e=>{
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
  e.preventDefault();
},{passive:false});
boardCanvas.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  const now=Date.now();
  if (Math.abs(dx)<12 && Math.abs(dy)<12) {
    if (now-lastTap<320) hardDrop(); else rotatePiece();
    lastTap=now; return;
  }
  if (Math.abs(dy)>Math.abs(dx)) { if(dy>0) moveDown(); }
  else { if(dx>0) moveRight(); else moveLeft(); }
  e.preventDefault();
},{passive:false});

// ── Boot ───────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startGame);
board = Array.from({length:ROWS},()=>Array(COLS).fill(0));
sizeBoard();
drawBoard();
</script>
</body>
</html>
