<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetris 🟦 — batmGAMES</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg1: #05070c;
  --bg2: #0a0d12;
  --card: #161d2b;
  --text: #f2f4ff;
  --muted: #8b92b0;
  --border: rgba(255,255,255,0.07);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body {
  height:100%; width:100%;
  background:var(--bg1); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden; user-select:none; -webkit-tap-highlight-color:transparent;
}
#app { display:flex; flex-direction:column; height:100vh; max-width:480px; margin:0 auto; }

/* topbar */
#topbar {
  display:flex; align-items:center; padding:10px 14px; gap:10px;
  background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0;
}
.back-btn {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; text-decoration:none; border-radius:10px;
  background:rgba(59,158,255,0.12); border:1px solid rgba(59,158,255,0.35);
  box-shadow:0 0 10px rgba(59,158,255,0.25),inset 0 0 8px rgba(59,158,255,0.08);
  transition:all 0.15s; flex-shrink:0;
}
.back-btn:active { transform:scale(0.92); box-shadow:0 0 18px rgba(59,158,255,0.5); }
.back-arrow {
  display:block; width:14px; height:14px;
  border-left:2.5px solid #3b9eff; border-bottom:2.5px solid #3b9eff;
  transform:rotate(45deg) translateX(2px); filter:drop-shadow(0 0 4px #3b9eff);
}
#topbar-title { flex:1; text-align:center; font-size:15px; font-weight:800; }
.score-pill {
  padding:6px 14px; background:var(--card); border-radius:999px;
  border:1px solid var(--border); font-size:13px; font-weight:800;
  color:#3b9eff; white-space:nowrap;
}

/* game layout */
#game-area {
  flex:1 1 0; display:flex; align-items:center; justify-content:center;
  gap:10px; padding:8px 10px; min-height:0; overflow:hidden;
}

/* board */
#board-wrap { position:relative; display:flex; align-items:center; justify-content:center; }
#board {
  display:block; border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 30px rgba(59,158,255,0.12);
}

/* side panel */
#side {
  display:flex; flex-direction:column; gap:10px; align-items:center;
  flex-shrink:0; width:68px;
}
.panel-box {
  width:100%; background:var(--card); border-radius:12px;
  border:1px solid var(--border); padding:8px 6px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.panel-label { font-size:9px; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.panel-val   { font-size:18px; font-weight:900; color:#3b9eff; line-height:1; }
#next-canvas { display:block; }

/* overlay */
.overlay {
  position:absolute; inset:0; border-radius:10px;
  background:rgba(5,7,12,0.88); backdrop-filter:blur(6px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px;
}
.overlay.hidden { display:none; }
.ov-emoji  { font-size:48px; line-height:1; }
.ov-title  { font-size:22px; font-weight:900; }
.ov-sub    { font-size:13px; color:var(--muted); text-align:center; padding:0 16px; }
.play-btn  {
  margin-top:6px; padding:13px 38px;
  background:linear-gradient(135deg,#3b9eff,#1a6fd4);
  color:#fff; border:none; border-radius:999px;
  font-size:15px; font-weight:800; cursor:pointer;
  box-shadow:0 4px 20px rgba(59,158,255,0.4);
}
.play-btn:active { transform:scale(0.96); }

/* d-pad buttons (mobile) */
#dpad {
  flex-shrink:0; display:grid;
  grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,44px);
  gap:6px; justify-content:center; padding:6px 0 12px;
}
.dp {
  width:44px; height:44px; background:var(--card);
  border:1px solid var(--border); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; cursor:pointer; transition:transform .1s,background .1s;
  -webkit-tap-highlight-color:transparent;
}
.dp:active { transform:scale(.9); background:#222c3d; }
#dp-rot { grid-column:2; grid-row:1; font-size:14px; font-weight:800; color:#3b9eff; }
#dp-left  { grid-column:1; grid-row:2; }
#dp-down  { grid-column:2; grid-row:2; }
#dp-right { grid-column:3; grid-row:2; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a class="back-btn" href="../"><span class="back-arrow"></span></a>
    <div id="topbar-title">🟦 Tetris</div>
    <div class="score-pill" id="score-top">0</div>
  </div>

  <div id="game-area">
    <div id="side">
      <div class="panel-box">
        <div class="panel-label">СЛЕД.</div>
        <canvas id="next-canvas" width="52" height="52"></canvas>
      </div>
      <div class="panel-box">
        <div class="panel-label">УРОВЕНЬ</div>
        <div class="panel-val" id="level-val">1</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">ЛИНИЙ</div>
        <div class="panel-val" id="lines-val">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">РЕКОРД</div>
        <div class="panel-val" id="best-val">0</div>
      </div>
    </div>

    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <div class="ov-emoji">🟦</div>
        <div class="ov-title">Tetris</div>
        <div class="ov-sub">Стрелки / свайп — движение.<br>↑ / тап — поворот.</div>
        <button class="play-btn" id="start-btn">ИГРАТЬ</button>
      </div>
    </div>
  </div>

  <div id="dpad">
    <div class="dp" id="dp-rot">↻</div>
    <div class="dp" id="dp-left">←</div>
    <div class="dp" id="dp-down">↓</div>
    <div class="dp" id="dp-right">→</div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Constants ──────────────────────────────────────────────────
const COLS = 10, ROWS = 20;
const COLORS = [
  null,
  '#00c2ff', // I — cyan
  '#ffd23e', // O — yellow
  '#a23cf5', // T — purple
  '#22c55e', // S — green
  '#ff4b4b', // Z — red
  '#3b9eff', // J — blue
  '#f97316', // L — orange
];
// Pieces: [shape matrix, color index]
const PIECES = [
  [[1,1,1,1]],                        // I
  [[2,2],[2,2]],                       // O
  [[0,3,0],[3,3,3]],                   // T
  [[0,4,4],[4,4,0]],                   // S
  [[5,5,0],[0,5,5]],                   // Z
  [[6,0,0],[6,6,6]],                   // J
  [[0,0,7],[7,7,7]],                   // L
];

// ── Canvas sizing ──────────────────────────────────────────────
const boardCanvas = document.getElementById('board');
const ctx         = boardCanvas.getContext('2d');
const nextCanvas  = document.getElementById('next-canvas');
const nctx        = nextCanvas.getContext('2d');
const boardWrap   = document.getElementById('board-wrap');
const gameArea    = document.getElementById('game-area');

let CS; // cell size

function sizeBoard() {
  const maxH = gameArea.clientHeight - 8;
  const maxW = gameArea.clientWidth  - 90; // side panel
  CS = Math.floor(Math.min(maxH / ROWS, maxW / COLS));
  boardCanvas.width  = CS * COLS;
  boardCanvas.height = CS * ROWS;
}
sizeBoard();
window.addEventListener('resize', () => { sizeBoard(); if (!running) drawBoard(); });

// ── State ──────────────────────────────────────────────────────
let board, piece, pieceX, pieceY, nextPiece;
let score, level, lines, best, running, dropping, ticker;

best = +localStorage.getItem('tetris_best') || 0;
document.getElementById('best-val').textContent = best;

// ── Helpers ────────────────────────────────────────────────────
function rng(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function newPiece() {
  return JSON.parse(JSON.stringify(rng(PIECES)));
}

function rotate(p) {
  const rows = p.length, cols = p[0].length;
  const r = Array.from({length:cols}, () => Array(rows).fill(0));
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) r[x][rows-1-y] = p[y][x];
  return r;
}

function fits(p, ox, oy) {
  for (let y=0;y<p.length;y++)
    for (let x=0;x<p[y].length;x++)
      if (p[y][x]) {
        const nx=ox+x, ny=oy+y;
        if (nx<0||nx>=COLS||ny>=ROWS) return false;
        if (ny>=0 && board[ny][nx]) return false;
      }
  return true;
}

function place() {
  for (let y=0;y<piece.length;y++)
    for (let x=0;x<piece[y].length;x++)
      if (piece[y][x] && pieceY+y >= 0)
        board[pieceY+y][pieceX+x] = piece[y][x];
}

function clearLines() {
  let cleared = 0;
  for (let y=ROWS-1;y>=0;y--) {
    if (board[y].every(c=>c)) {
      board.splice(y,1);
      board.unshift(Array(COLS).fill(0));
      cleared++; y++;
    }
  }
  if (!cleared) return;
  lines  += cleared;
  const pts = [0,100,300,500,800][cleared] * level;
  score  += pts;
  level   = Math.floor(lines/10)+1;
  updateUI();
  if (score > best) { best=score; localStorage.setItem('tetris_best',best); }
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function updateUI() {
  document.getElementById('score-top').textContent  = score;
  document.getElementById('level-val').textContent  = level;
  document.getElementById('lines-val').textContent  = lines;
  document.getElementById('best-val').textContent   = best;
}

// ── Draw ───────────────────────────────────────────────────────
function cellColor(v) { return COLORS[v] || null; }

function drawCell(c, x, y, size, alpha=1) {
  if (!c) return;
  const px = x*size, py = y*size, s = size-1, r = Math.max(2, size*0.18);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.roundRect(px+.5, py+.5, s, s, r); ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.roundRect(px+1.5, py+1.5, s*0.55, s*0.3, [r,r,0,0]); ctx.fill();
  // glow border
  ctx.globalAlpha = alpha * 0.5;
  ctx.strokeStyle = c;
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.roundRect(px+.5, py+.5, s, s, r); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawBoard() {
  ctx.clearRect(0,0,boardCanvas.width,boardCanvas.height);
  // background grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth   = 0.5;
  for (let x=0;x<=COLS;x++) { ctx.beginPath();ctx.moveTo(x*CS,0);ctx.lineTo(x*CS,boardCanvas.height);ctx.stroke(); }
  for (let y=0;y<=ROWS;y++) { ctx.beginPath();ctx.moveTo(0,y*CS);ctx.lineTo(boardCanvas.width,y*CS);ctx.stroke(); }

  // placed cells
  for (let y=0;y<ROWS;y++)
    for (let x=0;x<COLS;x++)
      if (board[y][x]) drawCell(cellColor(board[y][x]), x, y, CS);

  if (!running) return;

  // ghost piece
  let gy = pieceY;
  while (fits(piece, pieceX, gy+1)) gy++;
  if (gy !== pieceY) {
    for (let y=0;y<piece.length;y++)
      for (let x=0;x<piece[y].length;x++)
        if (piece[y][x]) drawCell(cellColor(piece[y][x]), pieceX+x, gy+y, CS, 0.18);
  }

  // active piece
  for (let y=0;y<piece.length;y++)
    for (let x=0;x<piece[y].length;x++)
      if (piece[y][x]) drawCell(cellColor(piece[y][x]), pieceX+x, pieceY+y, CS);
}

function drawNext() {
  nctx.clearRect(0,0,52,52);
  if (!nextPiece) return;
  const ns = Math.floor(52 / Math.max(nextPiece[0].length, nextPiece.length));
  const ox = Math.floor((52 - nextPiece[0].length*ns)/2);
  const oy = Math.floor((52 - nextPiece.length   *ns)/2);
  for (let y=0;y<nextPiece.length;y++)
    for (let x=0;x<nextPiece[y].length;x++)
      if (nextPiece[y][x]) {
        const c = cellColor(nextPiece[y][x]);
        const px=ox+x*ns, py=oy+y*ns, s=ns-1;
        nctx.fillStyle=c;
        nctx.beginPath(); nctx.roundRect(px,py,s,s,2); nctx.fill();
        nctx.fillStyle='rgba(255,255,255,0.2)';
        nctx.beginPath(); nctx.roundRect(px+1,py+1,s*0.5,s*0.28,[2,2,0,0]); nctx.fill();
      }
}

// ── Game loop ──────────────────────────────────────────────────
function spawnPiece() {
  piece  = nextPiece || newPiece();
  pieceX = Math.floor((COLS - piece[0].length) / 2);
  pieceY = -piece.length + 1;
  nextPiece = newPiece();
  drawNext();
  if (!fits(piece, pieceX, pieceY)) { gameOver(); return false; }
  return true;
}

function drop() {
  if (!running) return;
  if (fits(piece, pieceX, pieceY+1)) {
    pieceY++;
  } else {
    place();
    clearLines();
    if (!spawnPiece()) return;
  }
  drawBoard();
}

function startGame() {
  sizeBoard();
  board     = Array.from({length:ROWS}, () => Array(COLS).fill(0));
  score     = 0; level = 1; lines = 0;
  nextPiece = newPiece();
  running   = true;
  dropping  = false;
  updateUI();
  document.getElementById('overlay').classList.add('hidden');
  clearInterval(ticker);
  spawnPiece();
  drawBoard();
  resetTicker();
}

function resetTicker() {
  clearInterval(ticker);
  const ms = Math.max(80, 600 - (level-1)*50);
  ticker = setInterval(drop, ms);
}

function gameOver() {
  running = false;
  clearInterval(ticker);
  if (score > best) { best=score; localStorage.setItem('tetris_best',best); updateUI(); }
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <div class="ov-emoji">💥</div>
    <div class="ov-title">Игра окончена</div>
    <div class="ov-sub">Счёт: <b style="color:#3b9eff">${score}</b> · Рекорд: <b style="color:#ffd23e">${best}</b></div>
    <button class="play-btn" id="start-btn">ЕЩЁ РАЗ</button>
  `;
  ov.classList.remove('hidden');
  document.getElementById('start-btn').addEventListener('click', startGame);
}

// ── Controls ───────────────────────────────────────────────────
function moveLeft()   { if (running && fits(piece,pieceX-1,pieceY)) { pieceX--; drawBoard(); if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred('light'); } }
function moveRight()  { if (running && fits(piece,pieceX+1,pieceY)) { pieceX++; drawBoard(); if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred('light'); } }
function moveDown()   { if (running) { drop(); resetTicker(); } }
function rotatePiece(){ if (!running) return; const r=rotate(piece); if (fits(r,pieceX,pieceY)){piece=r;drawBoard();if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred('medium');} }
function hardDrop()   {
  if (!running) return;
  while (fits(piece,pieceX,pieceY+1)) { pieceY++; score+=2; }
  drop(); resetTicker();
  document.getElementById('score-top').textContent = score;
  if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred('heavy');
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft')  { moveLeft();  e.preventDefault(); }
  if (e.key==='ArrowRight') { moveRight(); e.preventDefault(); }
  if (e.key==='ArrowDown')  { moveDown();  e.preventDefault(); }
  if (e.key==='ArrowUp')    { rotatePiece();e.preventDefault(); }
  if (e.key===' ')          { hardDrop();  e.preventDefault(); }
});

// D-pad buttons
document.getElementById('dp-rot').addEventListener('click',   rotatePiece);
document.getElementById('dp-left').addEventListener('click',  moveLeft);
document.getElementById('dp-down').addEventListener('click',  moveDown);
document.getElementById('dp-right').addEventListener('click', moveRight);
// long press down = hard drop
let dpDownTimer;
document.getElementById('dp-down').addEventListener('pointerdown', () => { dpDownTimer = setTimeout(hardDrop, 400); });
document.getElementById('dp-down').addEventListener('pointerup',   () => clearTimeout(dpDownTimer));

// Touch swipe on board
let tx=0,ty=0,lastTap=0;
boardCanvas.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; e.preventDefault(); },{passive:false});
boardCanvas.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  const now=Date.now();
  if (Math.abs(dx)<10 && Math.abs(dy)<10) {
    if (now-lastTap<300) hardDrop(); else rotatePiece();
    lastTap=now; return;
  }
  if (Math.abs(dy)>Math.abs(dx)) { if(dy>0) moveDown(); }
  else { if(dx>0) moveRight(); else moveLeft(); }
  e.preventDefault();
},{passive:false});

// ── Start button ───────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startGame);

// ── Initial draw ───────────────────────────────────────────────
board = Array.from({length:ROWS},()=>Array(COLS).fill(0));
drawBoard();
</script>
</body>
</html>
